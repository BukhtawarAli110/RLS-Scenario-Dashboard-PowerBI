<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Header bar subtle gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow/Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Top Banner / Navigation Bar Container -->
  <rect x="30" y="24" width="1860" height="84" rx="14" fill="url(#headerGrad)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" filter="url(#cardShadow)"/>
  
  <!-- Subtle accent line under header -->
  <line x1="30" y1="108" x2="1890" y2="108" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" />

  <!-- Left Sidebar / Control Panel (RLS & Parameter Slicers) -->
  <rect x="30" y="128" width="360" height="920" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
  <!-- Sidebar header sub-panel -->
  <path d="M 30,144 A 16,16 0 0,1 46,128 L 374,128 A 16,16 0 0,1 390,144 L 390,188 L 30,188 Z" fill="#334155" fill-opacity="0.5" />
  <line x1="30" y1="188" x2="390" y2="188" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />

  <!-- KPI Row Containers (3 Metric Cards) -->
  <!-- KPI 1 -->
  <rect x="414" y="128" width="466" height="160" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
  <line x1="434" y1="180" x2="860" y2="180" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- KPI 2 -->
  <rect x="904" y="128" width="466" height="160" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
  <line x1="924" y1="180" x2="1350" y2="180" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- KPI 3 -->
  <rect x="1394" y="128" width="496" height="160" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
  <line x1="1414" y1="180" x2="1870" y2="180" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Main Chart Container (Middle - Bound to Field Parameter) -->
  <rect x="414" y="312" width="1476" height="390" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
  <!-- Subtle header bar for main chart -->
  <line x1="414" y1="368" x2="1890" y2="368" stroke="#334155" stroke-width="1" />

  <!-- Bottom Visual 1: Breakdown Matrix / Table -->
  <rect x="414" y="724" width="726" height="324" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
  <line x1="414" y1="774" x2="1140" y2="774" stroke="#334155" stroke-width="1" />

  <!-- Bottom Visual 2: Sensitive Manager Zone / Restricted Visual Area -->
  <rect x="1164" y="724" width="726" height="324" rx="16" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" filter="url(#cardShadow)"/>
  <line x1="1164" y1="774" x2="1890" y2="774" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
  
  <!-- Subtle indicator tag on restricted zone -->
  <rect x="1730" y="738" width="140" height="24" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="1800" y="754" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">RESTRICTED ZONE</text>
</svg>
